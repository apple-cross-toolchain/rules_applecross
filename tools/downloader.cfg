# Bazel downloader rewrite rules.
#
# The musl sources that --host_features=fully_static_link needs are listed by
# the llvm module with musl.libc.org as their only URL, and that host is
# regularly unreachable, which fails remote builds during analysis. Alpine
# mirrors upstream's tarballs byte for byte, so try the mirror first and fall
# back to upstream. Bazel still checks the integrity hash the llvm module
# declares, so a mirror cannot serve different bytes.
rewrite musl\.libc\.org/releases/(.*) distfiles.alpinelinux.org/distfiles/edge/$1
rewrite musl\.libc\.org/releases/(.*) musl.libc.org/releases/$1
