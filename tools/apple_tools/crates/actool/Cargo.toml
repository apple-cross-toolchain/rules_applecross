[package]
name = "actool"
description = "Asset catalog compilation compatible with Xcode's actool."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "actool"
path = "src/main.rs"

[dependencies]
cf.workspace = true
libz-sys = { version = "1", features = ["static"] }
lzfse.workspace = true
png = "0.17"
resvg = { version = "0.45", default-features = false }
serde_json = "1"
tiny-skia = "0.11"
usvg = { version = "0.45", default-features = false }
xcbuild-acdriver.workspace = true

[build-dependencies]
cc = "1"
