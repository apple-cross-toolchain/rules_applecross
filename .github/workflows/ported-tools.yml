name: ported-tools

on:
  pull_request:
    paths:
      - .github/workflows/ported-tools.yml
      - tests/actool_catalog/**
      - tests/actool_icon/**
      - tests/actool_vector/**
      - tests/ibtool_xib/**
      - tests/pngcrush/**
      - tools/xcode_equivalence.py
      - tools/apple_tools/**
      - tools/build-ported-tools.sh
      - tools/linux_vm/Containerfile
      - tools/system_tools/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/ported-tools.yml
      - tests/actool_catalog/**
      - tests/actool_icon/**
      - tests/actool_vector/**
      - tests/ibtool_xib/**
      - tests/pngcrush/**
      - tools/xcode_equivalence.py
      - tools/apple_tools/**
      - tools/build-ported-tools.sh
      - tools/linux_vm/Containerfile
      - tools/system_tools/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ported-tools -f tools/linux_vm/Containerfile tools/linux_vm
      - name: Build and test the ported tools
        run: >-
          docker run --rm -v "$PWD:$PWD" -w "$PWD" ported-tools bash -c
          'git config --global --add safe.directory "$PWD" &&
          tools/build-ported-tools.sh dist &&
          cd tools/apple_tools &&
          bazel test -c opt //... &&
          python3 ../../tests/actool_icon/actool_icon_test.py "$(bazel cquery -c opt --output=files //crates/actool 2>/dev/null)" &&
          python3 ../../tests/actool_catalog/actool_catalog_test.py "$(bazel cquery -c opt --output=files //crates/actool 2>/dev/null)" &&
          python3 ../../tests/actool_vector/actool_vector_test.py "$(bazel cquery -c opt --output=files //crates/actool 2>/dev/null)" &&
          python3 ../../tests/ibtool_xib/ibtool_xib_test.py "$(bazel cquery -c opt --output=files //crates/ibtool 2>/dev/null)" &&
          python3 ../../tests/pngcrush/pngcrush_test.py "$(bazel cquery -c opt --output=files //crates/pngcrush 2>/dev/null)"'
      - uses: actions/upload-artifact@v7
        with:
          name: ported-tools-linux-${{ matrix.arch }}
          path: dist/*.tar.zst
          retention-days: 7
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ported-tools-linux-*
          merge-multiple: true
          path: dist
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git tag --list 'ported-tools-*' --sort=-version:refname | head -n 1)"
          if git diff --quiet "$last" HEAD -- tools/apple_tools tools/system_tools tools/build-ported-tools.sh tools/linux_vm/Containerfile; then
            echo "The ported tools haven't changed since $last"
            exit 0
          fi
          version="${last#ported-tools-}"
          tag="ported-tools-${version%.*}.$((${version##*.} + 1))"
          cd dist
          sha256sum -- *.tar.zst > SHA256.txt
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Built from $GITHUB_SHA." \
            --latest=false \
            -- *.tar.zst SHA256.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  pin:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: |
          branch="pin-$TAG"
          title="Use ported tools ${TAG#ported-tools-}"
          gh release download "$TAG" --pattern SHA256.txt --output toolchain/ported_tools.sha256 --clobber
          sed -i "s|/download/ported-tools-[0-9.]*/|/download/$TAG/|" toolchain/apple_cross_toolchain.bzl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$title"
          git push origin "$branch"
          gh pr create --head "$branch" --title "$title" --body "Moves \`_PORTED_TOOLS_URL\` to \`$TAG\`, built from $GITHUB_SHA, and \`toolchain/ported_tools.sha256\` to that release's \`SHA256.txt\`."
