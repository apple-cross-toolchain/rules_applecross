name: ported-tools

on:
  pull_request:
    paths:
      - .github/workflows/ported-tools.yml
      - tests/actool_catalog/**
      - tests/actool_icon/**
      - tests/actool_vector/**
      - tests/ibtool_xib/**
      - tests/pngcrush/**
      - tools/xcode_equivalence.py
      - tools/apple_tools/**
      - tools/build-ported-tools.sh
      - tools/system_tools/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/ported-tools.yml
      - tests/actool_catalog/**
      - tests/actool_icon/**
      - tests/actool_vector/**
      - tests/ibtool_xib/**
      - tests/pngcrush/**
      - tools/xcode_equivalence.py
      - tools/apple_tools/**
      - tools/build-ported-tools.sh
      - tools/system_tools/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure BuildBuddy cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          [ -n "$BUILDBUDDY_API_KEY" ] || exit 0
          {
            echo 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            echo 'build --bes_backend=grpcs://app.buildbuddy.io'
            echo 'common --remote_cache=grpcs://app.buildbuddy.io'
            echo 'common --remote_cache_compression'
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
            echo 'build --modify_execution_info=CcConfigureMakeRule=+no-remote-cache'
          } > ~/.bazelrc
      - name: Build and test the ported tools
        run: |
          tools/build-ported-tools.sh dist
          cd tools/apple_tools
          bazel test -c opt //...
          python3 ../../tests/actool_icon/actool_icon_test.py "$(bazel cquery -c opt --output=files //crates/actool 2>/dev/null)"
          python3 ../../tests/actool_catalog/actool_catalog_test.py "$(bazel cquery -c opt --output=files //crates/actool 2>/dev/null)"
          python3 ../../tests/actool_vector/actool_vector_test.py "$(bazel cquery -c opt --output=files //crates/actool 2>/dev/null)"
          python3 ../../tests/ibtool_xib/ibtool_xib_test.py "$(bazel cquery -c opt --output=files //crates/ibtool 2>/dev/null)"
          python3 ../../tests/pngcrush/pngcrush_test.py "$(bazel cquery -c opt --output=files //crates/pngcrush 2>/dev/null)"
          cd swiftui_macros
          bazel test //...
      - uses: actions/upload-artifact@v7
        with:
          name: ported-tools-linux-${{ matrix.arch }}
          path: dist/*.tar.zst
          retention-days: 7
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ported-tools-linux-*
          merge-multiple: true
          path: dist
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git tag --list 'ported-tools-*' --sort=-version:refname | head -n 1)"
          if git diff --quiet "$last" HEAD -- tools/apple_tools tools/system_tools tools/build-ported-tools.sh; then
            echo "The ported tools haven't changed since $last"
            exit 0
          fi
          version="${last#ported-tools-}"
          tag="ported-tools-${version%.*}.$((${version##*.} + 1))"
          cd dist
          sha256sum -- *.tar.zst > SHA256.txt
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Built from $GITHUB_SHA." \
            --latest=false \
            -- *.tar.zst SHA256.txt
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  # One pin PR, on one branch, moved to each new release: its build runs by
  # dispatch (a PR GitHub's token opens starts no pull_request run), and it
  # merges itself when that passes (build.yml's merge_pin).
  pin:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    concurrency:
      group: pin-ported-tools
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - run: |
          branch=pin-ported-tools
          title="Use ported tools ${TAG#ported-tools-}"
          body="Moves \`_PORTED_TOOLS_URL\` to \`$TAG\`, built from $GITHUB_SHA, and \`toolchain/ported_tools.sha256\` to that release's \`SHA256.txt\`. Merges itself once its build passes."
          gh release download "$TAG" --pattern SHA256.txt --output toolchain/ported_tools.sha256 --clobber
          sed -i "s|/download/ported-tools-[0-9.]*/|/download/$TAG/|" toolchain/apple_cross_toolchain.bzl
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state --jq 'select(.state == "OPEN")' | grep -q .; then
            gh pr edit "$branch" --title "$title" --body "$body"
          else
            gh pr create --head "$branch" --title "$title" --body "$body"
          fi
          gh workflow run build.yml --ref "$branch"
