name: build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned rather than left to the runner default because MODULE.bazel pins the
  # Swift toolchain that has to match the Swift these SDKs were built with.
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODE_BUILD: 17F113
  BAZEL_VERSIONS: "[8, 9, 10]"

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bazel: ${{ steps.bazel.outputs.all }}
      macos-bazel: ${{ steps.bazel.outputs.macos }}
      sdks-key: ${{ steps.sdks.outputs.cache-primary-key }}
      sdks-hit: ${{ steps.sdks.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
      - name: Look up packaged Apple SDKs
        id: sdks
        uses: actions/cache/restore@v6
        with:
          path: apple-sdks.tar.zst
          key: apple-sdks-${{ env.XCODE_BUILD }}-${{ hashFiles('tools/package-sdks.sh') }}
          lookup-only: true
      - name: Pick Bazel versions
        id: bazel
        env:
          FULL_MACOS_MATRIX: ${{ github.event_name == 'push' || !github.event.pull_request.draft }}
        run: |
          echo "all=$BAZEL_VERSIONS" >> "$GITHUB_OUTPUT"
          if [ "$FULL_MACOS_MATRIX" = true ]; then
            echo "macos=$BAZEL_VERSIONS" >> "$GITHUB_OUTPUT"
          else
            echo "macos=[$(cut -d. -f1 .bazelversion)]" >> "$GITHUB_OUTPUT"
          fi
  package_sdks:
    needs: setup
    if: needs.setup.outputs.sdks-hit != 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check Xcode build
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          build=$(xcodebuild -version | sed -n 's/^Build version //p')
          if [ "$build" != "$XCODE_BUILD" ]; then
            echo "::error::$XCODE_DEVELOPER_DIR is build $build, but XCODE_BUILD is $XCODE_BUILD"
            exit 1
          fi
      - name: Package Apple SDKs
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: tools/package-sdks.sh
      - uses: actions/cache/save@v6
        with:
          path: apple-sdks.tar.zst
          key: ${{ needs.setup.outputs.sdks-key }}
  build:
    needs:
      - setup
      - package_sdks
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.bazel) }}
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Restore packaged Apple SDKs
        uses: actions/cache/restore@v6
        with:
          path: apple-sdks.tar.zst
          key: ${{ needs.setup.outputs.sdks-key }}
          fail-on-cache-miss: true
      # Fork pull requests receive no secrets, so they build without the cache.
      - name: Configure BuildBuddy cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          [ -n "$BUILDBUDDY_API_KEY" ] || exit 0
          {
            echo 'common --config=remote_cache'
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          } > ~/.bazelrc
      - run: >-
          bazel
          build
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
      - run: cp -rL bazel-out/k8-fastbuild/bin/examples/ios/HelloWorldSwiftUI/Tests.runfiles . && tar -cJvf Tests.tar.xz Tests.runfiles && rm -rf Tests.runfiles
      - name: Package macOS command-line examples
        run: |
          command_line=$(
            bazel cquery \
              --macos_cpus=arm64 \
              --output=files \
              //examples/macos/CommandLine:CommandLine
          )
          command_line_swift=$(
            bazel cquery \
              --macos_cpus=arm64 \
              --output=files \
              //examples/macos/CommandLineSwift:CommandLineSwift
          )
          mkdir CommandLineExamples
          cp -L "$command_line" CommandLineExamples/CommandLine
          cp -L "$command_line_swift" CommandLineExamples/CommandLineSwift
          tar -cJvf CommandLineExamples.tar.xz CommandLineExamples
      - uses: actions/upload-artifact@v7
        with:
          name: Tests-bazel${{ matrix.bazel }}
          path: Tests.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: CommandLineExamples-bazel${{ matrix.bazel }}
          path: CommandLineExamples.tar.xz
          retention-days: 1
  build_status:
    name: build
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = success
  run_tests:
    needs:
      - setup
      - build
    if: ${{ !cancelled() && !failure() }}
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macOS-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CommandLineExamples-bazel${{ matrix.bazel }}
          path: CommandLineExamples-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Run macOS command-line examples
        run: |
          unzip -q CommandLineExamples-artifact/* -d .
          tar -xf CommandLineExamples.tar.xz
          file CommandLineExamples/CommandLine CommandLineExamples/CommandLineSwift
          command_line_output=$(./CommandLineExamples/CommandLine 2>&1)
          printf '%s\n' "$command_line_output"
          grep -Fq 'Hello World from com.example.command-line' <<< "$command_line_output"
          command_line_swift_output=$(./CommandLineExamples/CommandLineSwift 2>&1)
          printf '%s\n' "$command_line_swift_output"
          grep -Fq 'Hello World from com.example.command-line-swift' <<< "$command_line_swift_output"
      - uses: actions/download-artifact@v8
        with:
          name: Tests-bazel${{ matrix.bazel }}
          path: Tests-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - run: |
          unzip -q Tests-artifact/* -d .
          tar -xf Tests.tar.xz && cd Tests.runfiles/_main
          tmpdir=$(mktemp -d)
          exec env - PATH=/bin:/usr/bin \
            TEST_PREMATURE_EXIT_FILE="$tmpdir/premature_exit" \
            TEST_SRCDIR="$PWD" \
            TEST_UNDECLARED_OUTPUTS_DIR="$tmpdir/outputs" \
            XML_OUTPUT_FILE="$tmpdir/tests.xml" \
            examples/ios/HelloWorldSwiftUI/Tests
  remote_build:
    # Fork pull requests receive no secrets, so remote execution (which needs
    # BUILDBUDDY_API_KEY) can only run for same-repo events.
    if: >-
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !cancelled() && !failure()
    needs:
      - setup
      - package_sdks
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.bazel) }}
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps: &remote_build_steps
      - uses: actions/checkout@v7
      - name: Restore packaged Apple SDKs
        uses: actions/cache/restore@v6
        with:
          path: apple-sdks.tar.zst
          key: ${{ needs.setup.outputs.sdks-key }}
          fail-on-cache-miss: true
      # MODULE.bazel prefers a local Xcode wherever one exists, so the macOS leg
      # has to ask for the archive to be testing anything the Linux leg is not.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=0
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  remote_build_macos:
    if: >-
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !cancelled() && !failure()
    needs:
      - setup
      - package_sdks
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps: *remote_build_steps
  remote_build_local_xcode:
    # The same remote build reading the runner's own Xcode instead of a
    # packaged archive. It is a separate job rather than another leg of
    # remote_build_macos because it needs no archive, and `needs` would make it
    # wait for package_sdks anyway.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Asking for the local Xcode explicitly turns a missing one into an error
      # rather than a silent fall back to an archive this job never downloaded.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  remote_compile:
    # A smoke test of the split build: compiling on the executors, everything
    # rules_apple produces on the runner's own Xcode. watchOS and visionOS are
    # left out because a real actool needs those simulator runtimes installed
    # and the runner image ships only iOS and tvOS. HelloWorldArchive is tagged
    # manual and named explicitly, since xcarchive shells out to
    # /usr/bin/codesign and so cannot be built by the all-remote job at all.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build examples with remote compilation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --
          //examples/...
          //examples/ios/HelloWorldObjC:HelloWorldArchive
          //examples/ios/MacOSPinnedSwift
          -//examples/watchos/...
          -//examples/visionos/...
      # Requiring the product toolchain on the XCFramework import rules makes
      # any consumer of them fail analysis. Nothing else here imports one.
      - name: Check XCFramework imports still analyze
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --nobuild
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          //tests/xcframework_import:Probe
