name: build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  # The ported-tools workflow's pin PRs, which GitHub's token can't start a
  # pull_request run for, and main after merging one (see merge_pin).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned rather than left to the runner default because MODULE.bazel pins the
  # Swift toolchain that has to match the Swift these SDKs were built with.
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  stub_sdk_tests:
    name: stub_sdk_tests (${{ matrix.runner }}, bazel_${{ matrix.bazel }})
    strategy:
      fail-fast: false
      matrix:
        bazel: [8, 9, 10]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - &buildbuddy_cache
        name: Configure BuildBuddy cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          [ -n "$BUILDBUDDY_API_KEY" ] || exit 0
          {
            echo 'common --config=remote_cache'
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          } > ~/.bazelrc
      - name: Generate stub SDKs
        run: tools/stub-sdks.py
      - name: Build and check apps against stub SDKs
        run: bazel test --keep_going //tests/stub_sdks/... //tests/xcode_xip/... //tests/xcstringstool/... //tests/appintentsmetadataprocessor/... //tests/coremlc/... //tests/momc/... //tests/xcode_equivalence/... //tests/swift_toolchain_attrs/... //tests/linux_swift/... //tests/swift_synthesize_interface/... //tests/layering_check/... //tests/clang_apple_flags/... //tests/xcode_pin/... //tests/metal/...
      - name: Analyze the examples against stub SDKs
        run: >-
          bazel
          build
          --nobuild
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  local_smoke_tests:
    name: local_smoke_tests (bazel_${{ matrix.bazel }})
    strategy: &macos_strategy
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(github.event_name != 'pull_request' && '[8, 9, 10]' || '[9]') }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - *buildbuddy_cache
      - name: Build the examples with the runner's Xcode
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=BAZEL_NO_APPLE_CPP_TOOLCHAIN=0
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  rbe_smoke_tests:
    name: rbe_smoke_tests (bazel_${{ matrix.bazel }})
    # The all-remote build, reading the runner's own Xcode.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy: *macos_strategy
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Asking for the local Xcode explicitly turns a missing one into an error
      # rather than a silent fall back to an archive this job never downloaded.
      # The runner's Xcode is 26.6, whose library versions the clean-room
      # actool and coremlc don't know; relax_xcode_version records 27.0's.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --config=relax_xcode_version
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          --
          //examples/...
          -//examples/tvos/...
      # The clean-room tools are strict: Xcode's output byte for byte, or the
      # build fails. The tvOS example's radiosity image and its Core Data
      # model's version hashes can't be guaranteed yet (docs/clean-room/actool.md
      # and momc.md), so this build accepts both as well.
      - name: Build the tvOS example with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --config=relax_xcode_version
          --config=relax_actool_tvos_radiosity
          --config=relax_momc
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --tvos_cpus=sim_arm64
          //examples/tvos/...
  multi-platform_rbe_smoke_tests:
    name: multi-platform_rbe_smoke_tests (bazel_${{ matrix.bazel }})
    # A smoke test of the split build: compiling on the executors, everything
    # rules_apple produces on the runner's own Xcode. watchOS and visionOS are
    # left out because a real actool needs those simulator runtimes installed
    # and the runner image ships only iOS and tvOS. HelloWorldArchive is tagged
    # manual and named explicitly, since xcarchive shells out to
    # /usr/bin/codesign and so cannot be built by the all-remote job at all.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy: *macos_strategy
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build examples with remote compilation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --
          //examples/...
          //examples/ios/HelloWorldObjC:HelloWorldArchive
          //examples/ios/MacOSPinnedSwift
          -//examples/watchos/...
          -//examples/visionos/...
      # Requiring the product toolchain on the XCFramework import rules makes
      # any consumer of them fail analysis. Nothing else here imports one.
      - name: Check XCFramework imports still analyze
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --nobuild
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          //tests/xcframework_import:Probe
  # A pin PR (ported-tools.yml) merges itself once every job above passed on
  # it, then runs this workflow on main, which a merge by GitHub's token
  # doesn't start.
  merge_pin:
    needs:
      - stub_sdk_tests
      - local_smoke_tests
      - rbe_smoke_tests
      - multi-platform_rbe_smoke_tests
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'pin-ported-tools'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          # Only the commit this run tested.
          head=$(gh pr view pin-ported-tools --json headRefOid,state --jq 'select(.state == "OPEN") | .headRefOid' || true)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "The pin PR is closed or moved on from $GITHUB_SHA; not merging."
            exit 0
          fi
          gh pr merge pin-ported-tools --squash --delete-branch --match-head-commit "$GITHUB_SHA"
          gh workflow run build.yml --ref main
