name: build

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned rather than left to the runner default because MODULE.bazel pins the
  # Swift toolchain that has to match the Swift these SDKs were built with.
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  BAZEL_VERSIONS: "[8, 9, 10]"

jobs:
  setup:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      bazel: ${{ steps.bazel.outputs.all }}
      macos-bazel: ${{ steps.bazel.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - name: Pick Bazel versions
        id: bazel
        env:
          FULL_MACOS_MATRIX: ${{ github.event_name == 'push' }}
        run: |
          echo "all=$BAZEL_VERSIONS" >> "$GITHUB_OUTPUT"
          if [ "$FULL_MACOS_MATRIX" = true ]; then
            echo "macos=$BAZEL_VERSIONS" >> "$GITHUB_OUTPUT"
          else
            echo "macos=[$(cut -d. -f1 .bazelversion)]" >> "$GITHUB_OUTPUT"
          fi
  stub_sdk_tests:
    name: stub_sdk_tests (bazel_${{ matrix.bazel }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.bazel) }}
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - &buildbuddy_cache
        name: Configure BuildBuddy cache
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          [ -n "$BUILDBUDDY_API_KEY" ] || exit 0
          {
            echo 'common --config=remote_cache'
            echo "common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          } > ~/.bazelrc
      - name: Generate stub SDKs
        run: tools/stub-sdks.py
      - name: Build and check apps against stub SDKs
        run: bazel test --keep_going //tests/stub_sdks/...
      - name: Analyze the examples against stub SDKs
        run: >-
          bazel
          build
          --nobuild
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  local_smoke_tests:
    name: local_smoke_tests (bazel_${{ matrix.bazel }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - *buildbuddy_cache
      - name: Build the examples with the runner's Xcode
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: tools/real-sdk-tests.sh macos
  build_status:
    name: build
    if: always()
    needs:
      - stub_sdk_tests
      - local_smoke_tests
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          STUB_SDK_TESTS: ${{ needs.stub_sdk_tests.result }}
          LOCAL_SMOKE_TESTS: ${{ needs.local_smoke_tests.result }}
        run: |
          test "$STUB_SDK_TESTS" = success
          test "$LOCAL_SMOKE_TESTS" = success
  rbe_smoke_tests:
    name: rbe_smoke_tests (bazel_${{ matrix.bazel }})
    # The all-remote build, reading the runner's own Xcode.
    if: false
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Asking for the local Xcode explicitly turns a missing one into an error
      # rather than a silent fall back to an archive this job never downloaded.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  multi-platform_rbe_smoke_tests:
    name: multi-platform_rbe_smoke_tests (bazel_${{ matrix.bazel }})
    # A smoke test of the split build: compiling on the executors, everything
    # rules_apple produces on the runner's own Xcode. watchOS and visionOS are
    # left out because a real actool needs those simulator runtimes installed
    # and the runner image ships only iOS and tvOS. HelloWorldArchive is tagged
    # manual and named explicitly, since xcarchive shells out to
    # /usr/bin/codesign and so cannot be built by the all-remote job at all.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        bazel: ${{ fromJSON(needs.setup.outputs.macos-bazel) }}
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}.*
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build examples with remote compilation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --
          //examples/...
          //examples/ios/HelloWorldObjC:HelloWorldArchive
          //examples/ios/MacOSPinnedSwift
          -//examples/watchos/...
          -//examples/visionos/...
      # Requiring the product toolchain on the XCFramework import rules makes
      # any consumer of them fail analysis. Nothing else here imports one.
      - name: Check XCFramework imports still analyze
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --nobuild
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          //tests/xcframework_import:Probe
