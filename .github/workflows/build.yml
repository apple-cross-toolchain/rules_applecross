name: build

on:
  pull_request:
  push:
    branches:
      - main

env:
  # Pinned rather than left to the runner default because MODULE.bazel pins the
  # Swift toolchain that has to match the Swift these SDKs were built with.
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  package_sdks:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Package Apple SDKs
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: tools/package-sdks.sh
      - uses: actions/upload-artifact@v7
        with:
          name: apple-sdks
          path: apple-sdks.tar.zst
          # The archive is already zstd-compressed.
          compression-level: 0
          retention-days: 1
  build:
    needs: package_sdks
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apple-sdks
          path: apple-sdks-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Extract Apple SDKs
        run: unzip -q apple-sdks-artifact/* -d . && rm -rf apple-sdks-artifact
      - name: Start Bazel cache adapter
        id: bazel-cache
        uses: thii/bazel-gha-remote-cache@ec0d6c63ffb5b90c35b5306ce4fdce621a724306 # v0.0.5
        with:
          storage-mode: pack
          github-token: ${{ github.token }}
          mode: >-
            ${{ github.event_name == 'push' &&
                github.ref == format(
                  'refs/heads/{0}',
                  github.event.repository.default_branch
                ) &&
                'read-write' || 'read-only' }}
      - run: >-
          bazel
          --bazelrc="${{ steps.bazel-cache.outputs.bazelrc }}"
          build
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
      - run: cp -rL bazel-out/k8-fastbuild/bin/examples/ios/HelloWorldSwiftUI/Tests.runfiles . && tar -cJvf Tests.tar.xz Tests.runfiles && rm -rf Tests.runfiles
      - name: Package macOS command-line examples
        env:
          BAZELRC: ${{ steps.bazel-cache.outputs.bazelrc }}
        run: |
          command_line=$(
            bazel --bazelrc="$BAZELRC" cquery \
              --macos_cpus=arm64 \
              --output=files \
              //examples/macos/CommandLine:CommandLine
          )
          command_line_swift=$(
            bazel --bazelrc="$BAZELRC" cquery \
              --macos_cpus=arm64 \
              --output=files \
              //examples/macos/CommandLineSwift:CommandLineSwift
          )
          mkdir CommandLineExamples
          cp -L "$command_line" CommandLineExamples/CommandLine
          cp -L "$command_line_swift" CommandLineExamples/CommandLineSwift
          tar -cJvf CommandLineExamples.tar.xz CommandLineExamples
      - uses: actions/upload-artifact@v7
        with:
          name: Tests
          path: Tests.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: CommandLineExamples
          path: CommandLineExamples.tar.xz
          retention-days: 1
  run_tests:
    needs: build
    runs-on: macOS-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CommandLineExamples
          path: CommandLineExamples-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Run macOS command-line examples
        run: |
          unzip -q CommandLineExamples-artifact/* -d .
          tar -xf CommandLineExamples.tar.xz
          file CommandLineExamples/CommandLine CommandLineExamples/CommandLineSwift
          command_line_output=$(./CommandLineExamples/CommandLine 2>&1)
          printf '%s\n' "$command_line_output"
          grep -Fq 'Hello World from com.example.command-line' <<< "$command_line_output"
          command_line_swift_output=$(./CommandLineExamples/CommandLineSwift 2>&1)
          printf '%s\n' "$command_line_swift_output"
          grep -Fq 'Hello World from com.example.command-line-swift' <<< "$command_line_swift_output"
      - uses: actions/download-artifact@v8
        with:
          name: Tests
          path: Tests-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - run: |
          unzip -q Tests-artifact/* -d .
          tar -xf Tests.tar.xz && cd Tests.runfiles/_main
          tmpdir=$(mktemp -d)
          exec env - PATH=/bin:/usr/bin \
            TEST_PREMATURE_EXIT_FILE="$tmpdir/premature_exit" \
            TEST_SRCDIR="$PWD" \
            TEST_UNDECLARED_OUTPUTS_DIR="$tmpdir/outputs" \
            XML_OUTPUT_FILE="$tmpdir/tests.xml" \
            examples/ios/HelloWorldSwiftUI/Tests
  remote_build:
    # Fork pull requests receive no secrets, so remote execution (which needs
    # BUILDBUDDY_API_KEY) can only run for same-repo events.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: package_sdks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apple-sdks
          path: apple-sdks-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Extract Apple SDKs
        run: unzip -q apple-sdks-artifact/* -d . && rm -rf apple-sdks-artifact
      # MODULE.bazel prefers a local Xcode wherever one exists, so the macOS leg
      # has to ask for the archive to be testing anything the Linux leg is not.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=0
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  remote_build_local_xcode:
    # The same remote build reading the runner's own Xcode instead of a
    # packaged archive. It is a separate job rather than a third leg of
    # remote_build because it needs no artifact, and `needs` would make it wait
    # for package_sdks anyway.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Asking for the local Xcode explicitly turns a missing one into an error
      # rather than a silent fall back to an archive this job never downloaded.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  delete_sdks:
    # The SDK tarball is only needed while the jobs that consume it run, so
    # drop it instead of leaving it in the artifact store until its retention
    # period expires. Fork pull requests receive a read-only token, which
    # cannot delete artifacts, so there the retention period is the only
    # cleanup.
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - build
      - remote_build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete Apple SDKs artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=apple-sdks" \
              --jq '.artifacts[].id'
          )
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
