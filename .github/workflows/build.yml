name: build

on:
  pull_request:
  push:
    branches:
      - main

env:
  # Pinned rather than left to the runner default because MODULE.bazel pins the
  # Swift toolchain that has to match the Swift these SDKs were built with.
  XCODE_DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  DARWIN_VM_REPOSITORY: apple-cross-toolchain/darwin-vm
  DARWIN_VM_REF: 6789fbe812d78e090bff28f07438f4ae4a04f911
  QEMU_SPTM_REF: 006cc6b174e6177e64d06a6457e4125fd627649f
  IOS_VM_DEVICE: iPhone13,2
  IOS_VM_DDI_ID: 022-21793-062.dmg
  IOS_VM_FIRMWARE_ID: iPhone13_2-iOS26.5-23F77
  IOS_VM_IPSW_URL: https://updates.cdn-apple.com/2026SpringFCS/fullrestores/122-75946/B3FDFDC5-1A50-4B12-ACA7-CB28486FB561/iPhone13,2,iPhone13,3_26.5_23F77_Restore.ipsw

jobs:
  package_sdks:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read Xcode identity
        id: xcode
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          identity=$(xcodebuild -version)
          echo "identity=${identity//$'\n'/-}" >> "$GITHUB_OUTPUT"
      - name: Cache packaged Apple SDKs
        id: apple-sdks-cache
        uses: actions/cache@v6
        with:
          path: apple-sdks.tar.zst
          key: apple-sdks-${{ steps.xcode.outputs.identity }}-${{ hashFiles('tools/package-sdks.sh') }}
      - name: Package Apple SDKs
        if: steps.apple-sdks-cache.outputs.cache-hit != 'true'
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: tools/package-sdks.sh
      - uses: actions/upload-artifact@v7
        with:
          name: apple-sdks
          path: apple-sdks.tar.zst
          # The archive is already zstd-compressed.
          compression-level: 0
          retention-days: 1
  package_ios_vm_assets:
    # Fork pull requests cannot access the BuildBuddy secret used downstream.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Restore iOS VM asset cache
        id: ios-vm-assets-cache
        uses: actions/cache/restore@v6
        with:
          path: ios-vm-assets.tar
          key: ios-vm-assets-plain-v1-${{ runner.os }}-xcode-26.6-${{ env.IOS_VM_DDI_ID }}-${{ env.IOS_VM_FIRMWARE_ID }}-${{ env.DARWIN_VM_REF }}
      - name: Clone pinned darwin-vm
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DARWIN_VM_REPOSITORY }}
          ref: ${{ env.DARWIN_VM_REF }}
          path: .ci/darwin-vm
          persist-credentials: false
      - name: Validate darwin-vm XCTest image builder
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        run: |
          bash -n .ci/darwin-vm/xctest/prepare_ramdisk.sh
          python3 -m py_compile \
            .ci/darwin-vm/xctest/test_slot.py \
            .ci/darwin-vm/xctest/test_slot_test.py
          python3 .ci/darwin-vm/xctest/test_slot_test.py
          plutil -lint \
            .ci/darwin-vm/xctest/xctest_host-Info.plist \
            .ci/darwin-vm/xctest/test_bundle-Info.plist
      - name: Install firmware extraction tools
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        run: brew install ipsw jq wget
      - name: Check XCTest image prerequisites
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          sudo -n true
          test -d "$DEVELOPER_DIR"
          xcrun --sdk iphoneos --show-sdk-path
          ddi_manifest=/Library/Developer/DeveloperDiskImages/iOS_DDI/Restore/BuildManifest.plist
          test -f "$ddi_manifest"
          ddi_name=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :BuildIdentities:0:Manifest:PersonalizedDMG:Info:Path' \
              "$ddi_manifest"
          )
          test "$ddi_name" = "$IOS_VM_DDI_ID"
      - name: Extract non-SPTM iPhone firmware
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        working-directory: .ci/darwin-vm
        env:
          DEVNAME: ${{ env.IOS_VM_DEVICE }}
          URL: ${{ env.IOS_VM_IPSW_URL }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: ./get_files.sh
      - name: Prepare XCTest ramdisk
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        working-directory: .ci/darwin-vm
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          ./xctest/prepare_ramdisk.sh
          --ramdisk firmware/ramdisk.dmg
          --hashes firmware/all_hashes
          --output-dir firmware/xctest
      - name: Stage iOS VM artifact
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          source=.ci/darwin-vm/firmware
          destination=ios-vm-assets
          mkdir "$destination"
          install -m 0644 "$source/bootkc" "$destination/bootkc"
          install -m 0644 "$source/dtree" "$destination/dtree"
          install -m 0644 "$source/xctest/ramdisk.dmg" "$destination/ramdisk.dmg"
          install -m 0644 "$source/xctest/ramdisk.tc" "$destination/ramdisk.tc"
          install -m 0644 "$source/xctest/slot.json" "$destination/slot.json"
          test ! -e "$source/sptm"
          test ! -e "$source/txm"
      - name: Package iOS VM artifact
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        run: tar -C ios-vm-assets -cf ios-vm-assets.tar .
      - name: Save iOS VM asset cache
        if: steps.ios-vm-assets-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios-vm-assets.tar
          key: ${{ steps.ios-vm-assets-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ios-vm-assets
          path: ios-vm-assets.tar
          compression-level: 0
          overwrite: true
          retention-days: 1
  build:
    needs: package_sdks
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apple-sdks
          path: apple-sdks-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Extract Apple SDKs
        run: unzip -q apple-sdks-artifact/* -d . && rm -rf apple-sdks-artifact
      - name: Start Bazel cache adapter
        id: bazel-cache
        uses: thii/bazel-gha-remote-cache@ec0d6c63ffb5b90c35b5306ce4fdce621a724306 # v0.0.5
        with:
          storage-mode: pack
          github-token: ${{ github.token }}
          mode: >-
            ${{ github.event_name == 'push' &&
                github.ref == format(
                  'refs/heads/{0}',
                  github.event.repository.default_branch
                ) &&
                'read-write' || 'read-only' }}
      - run: >-
          bazel
          --bazelrc="${{ steps.bazel-cache.outputs.bazelrc }}"
          build
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
      - run: cp -rL bazel-out/k8-fastbuild/bin/examples/ios/HelloWorldSwiftUI/Tests.runfiles . && tar -cJvf Tests.tar.xz Tests.runfiles && rm -rf Tests.runfiles
      - name: Package macOS command-line examples
        env:
          BAZELRC: ${{ steps.bazel-cache.outputs.bazelrc }}
        run: |
          command_line=$(
            bazel --bazelrc="$BAZELRC" cquery \
              --macos_cpus=arm64 \
              --output=files \
              //examples/macos/CommandLine:CommandLine
          )
          command_line_swift=$(
            bazel --bazelrc="$BAZELRC" cquery \
              --macos_cpus=arm64 \
              --output=files \
              //examples/macos/CommandLineSwift:CommandLineSwift
          )
          mkdir CommandLineExamples
          cp -L "$command_line" CommandLineExamples/CommandLine
          cp -L "$command_line_swift" CommandLineExamples/CommandLineSwift
          tar -cJvf CommandLineExamples.tar.xz CommandLineExamples
      - uses: actions/upload-artifact@v7
        with:
          name: Tests
          path: Tests.tar.xz
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: CommandLineExamples
          path: CommandLineExamples.tar.xz
          retention-days: 1
  run_tests:
    needs: build
    runs-on: macOS-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CommandLineExamples
          path: CommandLineExamples-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Run macOS command-line examples
        run: |
          unzip -q CommandLineExamples-artifact/* -d .
          tar -xf CommandLineExamples.tar.xz
          file CommandLineExamples/CommandLine CommandLineExamples/CommandLineSwift
          command_line_output=$(./CommandLineExamples/CommandLine 2>&1)
          printf '%s\n' "$command_line_output"
          grep -Fq 'Hello World from com.example.command-line' <<< "$command_line_output"
          command_line_swift_output=$(./CommandLineExamples/CommandLineSwift 2>&1)
          printf '%s\n' "$command_line_swift_output"
          grep -Fq 'Hello World from com.example.command-line-swift' <<< "$command_line_swift_output"
      - uses: actions/download-artifact@v8
        with:
          name: Tests
          path: Tests-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - run: |
          unzip -q Tests-artifact/* -d .
          tar -xf Tests.tar.xz && cd Tests.runfiles/_main
          tmpdir=$(mktemp -d)
          exec env - PATH=/bin:/usr/bin \
            TEST_PREMATURE_EXIT_FILE="$tmpdir/premature_exit" \
            TEST_SRCDIR="$PWD" \
            TEST_UNDECLARED_OUTPUTS_DIR="$tmpdir/outputs" \
            XML_OUTPUT_FILE="$tmpdir/tests.xml" \
            examples/ios/HelloWorldSwiftUI/Tests
  remote_build:
    # Fork pull requests receive no secrets, so remote execution (which needs
    # BUILDBUDDY_API_KEY) can only run for same-repo events.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: package_sdks
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apple-sdks
          path: apple-sdks-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - name: Extract Apple SDKs
        run: unzip -q apple-sdks-artifact/* -d . && rm -rf apple-sdks-artifact
      # MODULE.bazel prefers a local Xcode wherever one exists, so the macOS leg
      # has to ask for the archive to be testing anything the Linux leg is not.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=0
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  remote_build_local_xcode:
    # The same remote build reading the runner's own Xcode instead of a
    # packaged archive. It is a separate job rather than a third leg of
    # remote_build because it needs no artifact, and `needs` would make it wait
    # for package_sdks anyway.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Asking for the local Xcode explicitly turns a missing one into an error
      # rather than a silent fall back to an archive this job never downloaded.
      - name: Build examples and tests with remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: >-
          bazel
          build
          --config=remote
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --watchos_cpus=arm64
          //examples/...
  remote_compile:
    # A smoke test of the split build: compiling on the executors, everything
    # rules_apple produces on the runner's own Xcode. watchOS and visionOS are
    # left out because a real actool needs those simulator runtimes installed
    # and the runner image ships only iOS and tvOS. HelloWorldArchive is tagged
    # manual and named explicitly, since xcarchive shells out to
    # /usr/bin/codesign and so cannot be built by the all-remote job at all.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build examples with remote compilation
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          --macos_cpus=arm64
          --tvos_cpus=sim_arm64
          --
          //examples/...
          //examples/ios/HelloWorldObjC:HelloWorldArchive
          -//examples/watchos/...
          -//examples/visionos/...
      # Requiring the product toolchain on the XCFramework import rules makes
      # any consumer of them fail analysis. Nothing else here imports one.
      - name: Check XCFramework imports still analyze
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: >-
          bazel
          build
          --nobuild
          --config=remote_compile
          --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY"
          --repo_env=RULES_APPLECROSS_LOCAL_XCODE=1
          --repo_env=DEVELOPER_DIR="$XCODE_DEVELOPER_DIR"
          --ios_multi_cpus=sim_arm64
          //tests/xcframework_import:Probe
  ios_vm_test:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs:
      - package_sdks
      - package_ios_vm_assets
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Clone pinned darwin-vm with QEMU
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DARWIN_VM_REPOSITORY }}
          ref: ${{ env.DARWIN_VM_REF }}
          path: .ci/darwin-vm
          submodules: true
          persist-credentials: false
      - name: Verify pinned darwin-vm checkout
        run: |
          test "$(git -C .ci/darwin-vm rev-parse HEAD)" = "$DARWIN_VM_REF"
          test "$(git -C .ci/darwin-vm/qemu-sptm rev-parse HEAD)" = "$QEMU_SPTM_REF"
      - name: Restore QEMU cache
        id: qemu-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci/darwin-vm/qemu-sptm/build/qemu-system-aarch64
          key: qemu-sptm-v1-ubuntu-24.04-arm-${{ env.QEMU_SPTM_REF }}
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            --no-install-recommends \
            build-essential \
            ca-certificates \
            device-tree-compiler \
            git \
            libfdt-dev \
            libglib2.0-dev \
            ninja-build \
            pkg-config \
            python3-venv \
            zlib1g-dev
      - name: Build darwin-vm QEMU
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        working-directory: .ci/darwin-vm/qemu-sptm
        run: |
          mkdir -p build
          cd build
          configured=false
          for attempt in 1 2 3; do
            if ../configure \
              --target-list=aarch64-softmmu \
              --without-default-features \
              --enable-tcg \
              --disable-docs; then
              configured=true
              break
            fi
            rm -rf \
              ../subprojects/berkeley-softfloat-3 \
              ../subprojects/berkeley-testfloat-3
            echo "QEMU configure attempt $attempt failed; retrying" >&2
          done
          test "$configured" = true
          ninja -j"$(nproc)" qemu-system-aarch64
          strip --strip-unneeded qemu-system-aarch64
      - name: Save QEMU cache
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci/darwin-vm/qemu-sptm/build/qemu-system-aarch64
          key: ${{ steps.qemu-cache.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v8
        with:
          name: apple-sdks
          path: apple-sdks-artifact
          # Work around actions/download-artifact#484 until its bundled
          # unzip-stream dependency no longer uses the deprecated Buffer().
          skip-decompress: true
      - uses: actions/download-artifact@v8
        with:
          name: ios-vm-assets
          path: ios-vm-assets-artifact
          skip-decompress: true
      - name: Extract Apple SDKs and iOS VM assets
        run: |
          unzip -q apple-sdks-artifact/* -d examples/ios/VMUnitTest
          mkdir .ci/ios-vm-assets-download
          unzip -q ios-vm-assets-artifact/* -d .ci/ios-vm-assets-download
          asset_archive=$(find .ci/ios-vm-assets-download -type f -name ios-vm-assets.tar -print -quit)
          test -n "$asset_archive"
          tar -xf "$asset_archive" -C examples/ios/VMUnitTest/assets
          install -m 0755 \
            .ci/darwin-vm/qemu-sptm/build/qemu-system-aarch64 \
            examples/ios/VMUnitTest/assets/qemu-system-aarch64
          rm -rf .ci/darwin-vm
      - name: Verify iOS VM assets
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(awk '/MemTotal/ {print $2}' /proc/meminfo)" -ge $((12 * 1024 * 1024))
          test "$(df -Pk . | awk 'END {print $4}')" -ge $((6 * 1024 * 1024))
          python3 -c 'import sys; assert sys.version_info >= (3, 10)'

          root=examples/ios/VMUnitTest/assets
          for file in \
            qemu-system-aarch64 \
            bootkc \
            dtree \
            ramdisk.dmg \
            ramdisk.tc \
            slot.json; do
            test -s "$root/$file"
          done
          ldd_output=$(ldd "$root/qemu-system-aarch64")
          ! grep -Fq 'not found' <<< "$ldd_output"
          machine_output=$("$root/qemu-system-aarch64" -machine help)
          grep -Eq '^darwin[[:space:]]' <<< "$machine_output"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("examples/ios/VMUnitTest/assets")
          manifest = json.loads((root / "slot.json").read_text())
          assert manifest["version"] == 2
          assert manifest["architecture"] == "arm64"
          expected = {
              "bootkc": "bootkc",
              "device_tree": "dtree",
              "ramdisk": "ramdisk.dmg",
              "trust_cache": "ramdisk.tc",
          }
          assert set(manifest["input_sha256"]) == set(expected)
          for key, filename in expected.items():
              digest = hashlib.sha256((root / filename).read_bytes()).hexdigest()
              assert digest == manifest["input_sha256"][key], key
          PY
      - name: Run iOS unit test in darwin-vm
        working-directory: examples/ios/VMUnitTest
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          bazel test \
            --config=remote \
            --remote_header=x-buildbuddy-api-key="$BUILDBUDDY_API_KEY" \
            --repo_env=RULES_APPLECROSS_LOCAL_XCODE=0 \
            --apple_platform_type=ios \
            --ios_multi_cpus=arm64 \
            --nocache_test_results \
            --test_output=streamed \
            --test_timeout=1200 \
            //:UnitTests
  delete_ios_vm_assets:
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - ios_vm_test
      - package_ios_vm_assets
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete iOS VM artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=ios-vm-assets" \
              --jq '.artifacts[].id'
          )
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
  delete_sdks:
    # The SDK tarball is only needed while the jobs that consume it run, so
    # drop it instead of leaving it in the artifact store until its retention
    # period expires. Fork pull requests receive a read-only token, which
    # cannot delete artifacts, so there the retention period is the only
    # cleanup.
    if: >-
      always() &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - build
      - ios_vm_test
      - remote_build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Delete Apple SDKs artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=apple-sdks" \
              --jq '.artifacts[].id'
          )
          for id in $ids; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
